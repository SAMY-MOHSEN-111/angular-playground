<div class="min-h-screen w-screen flex flex-col items-center justify-center gap-8 p-8 bg-gray-50">
  <nav>
    <ul class="fixed inset-0 flex justify-center flex-wrap gap-2 p-5 h-10">
      @for (route of routes; track route.path) {
        <li>
          <ui-button variant="outlined" (clicked)="router.navigate([route.path])">{{route.path?.split("/")?.at(1)}}</ui-button>
        </li>
      }
    </ul>
  </nav>
<router-outlet></router-outlet>
</div>
